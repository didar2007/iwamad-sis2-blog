<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      const segmentCount = 1;
      const path = window.location.pathname.split('/').slice(segmentCount + 1).join('/');
      const query = window.location.search;
      const hash = window.location.hash;
      window.location.replace(
        window.location.origin + '/iwamad-sis2-blog/?/' + path + query + hash
      );
    </script>
  </head>
  <body>Redirecting...</body>
</html>
